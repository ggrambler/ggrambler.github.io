<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Music | Obsidian Local</title>

  <link
    rel="stylesheet"
    href="./music.css"
  >
</head>


<body>

<header class="topbar">

  <a
    href="../"
    class="home-button"
  >
    ← Home
  </a>


  <div class="brand">

    <span class="gem">
      ◆
    </span>

    <div>

      <strong>
        Music
      </strong>

      <span id="libraryCount">
        Loading...
      </span>

    </div>

  </div>


  <button
    id="favoritesOnlyButton"
    class="top-button"
    type="button"
  >
    ♡
  </button>

</header>



<main class="music-layout">


  <!-- ============================= -->
  <!-- LEFT SIDE: LIBRARY            -->
  <!-- ============================= -->

  <section class="library">


    <div class="library-toolbar">

      <input
        id="searchInput"
        type="search"
        placeholder="Search songs, artists, albums..."
      >


      <select id="sortSelect">

        <option value="default">
          Library order
        </option>

        <option value="title">
          Title
        </option>

        <option value="artist">
          Artist
        </option>

        <option value="album">
          Album
        </option>

      </select>

    </div>



    <div class="table-header">

      <span>#</span>

      <span>
        Title
      </span>

      <span>
        Artist
      </span>

      <span>
        Album
      </span>

      <span>
        ♥
      </span>

    </div>



    <div
      id="trackList"
      class="track-list"
    ></div>


    <div
      id="emptyState"
      class="empty-state hidden"
    >
      No songs found.
    </div>


  </section>



  <!-- ============================= -->
  <!-- RIGHT SIDE: PLAYER            -->
  <!-- ============================= -->

  <section class="player-area">


    <div class="player">


      <div class="cover-wrapper">

        <img
          id="coverImage"
          class="cover"
          src="./muisc.jpg"
          alt="Album artwork"
        >

      </div>



      <div class="song-info">

        <span class="small-label">
          NOW PLAYING
        </span>

        <h1 id="currentTitle">
          Select a song
        </h1>

        <p id="currentArtist">
          Your music library
        </p>

        <p
          id="currentAlbum"
          class="album"
        ></p>

      </div>



      <!-- SEEK -->

      <div class="seek-area">

        <span id="currentTime">
          0:00
        </span>


        <input
          id="seekBar"
          type="range"
          min="0"
          max="1000"
          value="0"
        >


        <span id="duration">
          0:00
        </span>

      </div>



      <!-- PLAYER CONTROLS -->

      <div class="controls">

        <button
          id="shuffleButton"
          class="control secondary"
          type="button"
        >
          🔀
        </button>


        <button
          id="previousButton"
          class="control"
          type="button"
        >
          ⏮
        </button>


        <button
          id="playButton"
          class="control play"
          type="button"
        >
          ▶
        </button>


        <button
          id="nextButton"
          class="control"
          type="button"
        >
          ⏭
        </button>


        <button
          id="repeatButton"
          class="control secondary"
          type="button"
        >
          ↻
        </button>

      </div>



      <!-- SECONDARY CONTROLS -->

      <div class="secondary-controls">


        <button
          id="favoriteButton"
          class="favorite-button"
          type="button"
        >
          ♡ Favourite
        </button>

        <button
            id="downloadButton"
            class="favorite-button"
          type="button"
          disabled
        >
          ⬇ Download
        </button>



        <div class="volume">

          <span>
            🔊
          </span>

          <input
            id="volumeBar"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          >

        </div>


      </div>



      <!-- UP NEXT -->

      <div class="next-card">

        <div>

          <span class="small-label">
            UP NEXT
          </span>

          <strong id="nextSong">
            —
          </strong>

        </div>


        <span
          id="streamStatus"
          class="stream-status"
        >
          No audio downloaded
        </span>

      </div>



      <!--
          IMPORTANT:

          There is deliberately NO src.

          Therefore visiting /music/ does not
          download a song.

          src is assigned in JS only when
          a user selects a track.
      -->

      <audio
        id="audioPlayer"
        preload="metadata"
      ></audio>


    </div>

  </section>


</main>


<script src="./music.js"></script>

</body>

</html>
